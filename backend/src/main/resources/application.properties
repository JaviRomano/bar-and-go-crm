spring.application.name=bar-and-go-crm

# Perfil por defecto al arrancar en local. En despliegue: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# Variables de entorno desde .env (raíz del monorepo o carpeta backend). Las del sistema tienen prioridad.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false

# El esquema lo gestiona Flyway en todos los perfiles; Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
# Adopta una BD creada antes de Flyway (por ddl-auto=update) como versión 1 sin reejecutar el baseline
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.port=${SERVER_PORT:8080}

# Hilos virtuales (Java 21+) para peticiones y tareas asíncronas
spring.threads.virtual.enabled=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:PT2H}
app.jwt.issuer=bar-and-go-crm

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Food cost objetivo por defecto de los escandallos, en % sobre PVP sin IVA; cada escandallo puede fijar el suyo
app.recipes.target-food-cost-pct=${TARGET_FOOD_COST_PCT:30}
